application:
  port: 8080
  host: "0.0.0.0"
  domain: "localhost"
  bodylimit: "25mib"
  ipv6: false

database:
  user: "postgres"
  # No default: the application refuses to start without one.
  password: "change-me-use-a-long-random-value"
  host: "db-pemasak"    # ← Change from "localhost" to "db-pemasak" 
  port: 5432
  name: "postgres"      # ← Change from "dev" to "postgres"
  timeout: 20

git:
  auth: true
  base: "./git-repo"

log:
  dev: false

auth:
  sso: false
  # in hour
  lifespan: 168
  cookiename: session
  # in days
  maxage: 365
  httponly: true
  # true in any deployment reachable over HTTPS, otherwise the session cookie
  # can travel in cleartext.
  secure: true
  # At least 64 bytes, used to encrypt the session cookie. Without it a random
  # key is generated at startup and sessions do not survive a restart; more
  # importantly, an unsigned cookie lets any subdomain -- including a deployed
  # student app -- set a session for the parent domain.
  key: "change-me-generate-64-plus-random-bytes-eg-openssl-rand-base64-64"
  # in days
  maxlifespan: 365

build:
  max: 2
  # in microseconds (100ms === 1 CPU allocation)
  cpums: 100000
  # in miliseconds
  timeout: 120000

container:
  cpu: 0.5
  # amount of swap = memory_swap - memory_limit
  memory: 256M
  swap: 320M

grafana:
  user: "change-me"
  password: "change-me-use-a-long-random-value"
