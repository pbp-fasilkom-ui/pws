name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: '1.72.0'
  NODE_VERSION: '20.x'
  PNPM_VERSION: '8.15.9'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check and test backend
        run: |
          cargo check --locked --all-targets
          cargo test --locked --all-targets

      - name: Run Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --locked --all-targets -- -D warnings

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            docs-ui/pnpm-lock.yaml

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Lint UI (advisory)
        working-directory: ui
        continue-on-error: true
        run: pnpm lint

      - name: Build UI
        working-directory: ui
        run: pnpm build

      - name: Install documentation dependencies
        working-directory: docs-ui
        run: pnpm install --frozen-lockfile

      - name: Typecheck documentation (advisory)
        working-directory: docs-ui
        continue-on-error: true
        run: pnpm typecheck

      - name: Build documentation
        working-directory: docs-ui
        run: pnpm build

  container:
    name: Build container
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: pemasak-infra:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [container]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: [publish]
    environment: production
    steps:
      - name: Deploy published image over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:latest
          REGISTRY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          REGISTRY_USER: ${{ secrets.GHCR_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE,REGISTRY_TOKEN,REGISTRY_USER,DEPLOY_PATH
          script_stop: true
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
            PWS_IMAGE="$IMAGE" docker compose pull server
            PWS_IMAGE="$IMAGE" docker compose up -d --no-build server
            docker image prune -f
            curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8080/health
