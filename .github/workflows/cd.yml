name: CD

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected revision to production
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Rebuild and restart server on VM
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_BRANCH: master
          IMAGE_TAG: pws-server:${{ github.sha }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,DEPLOY_BRANCH,IMAGE_TAG
          command_timeout: 40m
          script_stop: true
          script: |
            set -eu

            : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
            : "${DEPLOY_BRANCH:?DEPLOY_BRANCH is required}"
            : "${IMAGE_TAG:?IMAGE_TAG is required}"

            cd "$DEPLOY_PATH"
            test -f docker-compose.yml
            test -f .env

            if [ -n "$(git status --porcelain)" ]; then
              echo "Deployment stopped: the deployment checkout has local changes." >&2
              exit 1
            fi

            git fetch --prune origin "$DEPLOY_BRANCH"
            if git show-ref --verify --quiet "refs/heads/$DEPLOY_BRANCH"; then
              git checkout "$DEPLOY_BRANCH"
            else
              git checkout -b "$DEPLOY_BRANCH" --track "origin/$DEPLOY_BRANCH"
            fi
            git pull --ff-only origin "$DEPLOY_BRANCH"

            previous_image="$(docker inspect --format '{{.Config.Image}}' server-pemasak 2>/dev/null || true)"

            PWS_IMAGE="$IMAGE_TAG" docker compose build server
            PWS_IMAGE="$IMAGE_TAG" docker compose up -d --no-build --no-deps server

            if ! curl --fail --silent --show-error --retry 10 --retry-delay 3 http://127.0.0.1:8080/health; then
              echo "Deployment health check failed; attempting rollback." >&2
              if [ -n "$previous_image" ] && docker image inspect "$previous_image" >/dev/null 2>&1; then
                PWS_IMAGE="$previous_image" docker compose up -d --no-build --no-deps server
                curl --fail --silent --show-error --retry 10 --retry-delay 3 http://127.0.0.1:8080/health
              fi
              exit 1
            fi

            printf '\nDeployment completed for %s.\n' "$IMAGE_TAG"
