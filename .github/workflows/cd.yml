name: CD

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production through OpenVPN
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production

    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is not configured." >&2; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is not configured." >&2; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH is not configured." >&2; exit 1; }

          # These are expanded into a single-quoted string in the remote shell
          # below. DEPLOY_PATH is a repo variable, and write access to variables
          # is often granted more freely than to secrets -- a value containing a
          # quote would break out and execute as DEPLOY_USER on the VM.
          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "DEPLOY_PATH must be an absolute path." >&2; exit 1 ;;
          esac
          printf '%s' "$DEPLOY_PATH" | grep -qE '^/[A-Za-z0-9._/-]+$' \
            || { echo "DEPLOY_PATH contains unexpected characters." >&2; exit 1; }
          printf '%s' "$DEPLOY_HOST" | grep -qE '^[A-Za-z0-9.-]+$' \
            || { echo "DEPLOY_HOST contains unexpected characters." >&2; exit 1; }
          printf '%s' "$DEPLOY_USER" | grep -qE '^[A-Za-z0-9._-]+$' \
            || { echo "DEPLOY_USER contains unexpected characters." >&2; exit 1; }
          test -n "$OPENVPN_CONFIG" || { echo "OPENVPN_CONFIG is not configured." >&2; exit 1; }
          test -n "$DEPLOY_SSH_KEY_B64" || { echo "DEPLOY_SSH_KEY_B64 is not configured." >&2; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS is not configured." >&2; exit 1; }

      - name: Install OpenVPN and network tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes openvpn netcat-openbsd

      - name: Connect to production VPN
        env:
          OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
        run: |
          umask 077
          printf '%s' "$OPENVPN_CONFIG" > "$RUNNER_TEMP/production.ovpn"

          sudo openvpn \
            --config "$RUNNER_TEMP/production.ovpn" \
            --auth-nocache \
            --daemon \
            --writepid "$RUNNER_TEMP/openvpn.pid" \
            --log "$RUNNER_TEMP/openvpn.log"

          for attempt in {1..30}; do
            if sudo grep -q "Initialization Sequence Completed" "$RUNNER_TEMP/openvpn.log"; then
              echo "OpenVPN connection established."
              exit 0
            fi
            sleep 2
          done

          echo "OpenVPN failed to connect:" >&2
          sudo tail -n 80 "$RUNNER_TEMP/openvpn.log" >&2
          exit 1

      - name: Verify SSH route through VPN
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: nc -zvw 10 "$DEPLOY_HOST" 22

      - name: Deploy on VM
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          umask 077
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known-hosts"

          ssh -i "$RUNNER_TEMP/deploy-key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known-hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd -- '$DEPLOY_PATH' && ./scripts/deploy-local.sh '$EXPECTED_SHA'"

      - name: Disconnect from production VPN
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/openvpn.pid"; then
            sudo kill "$(sudo cat "$RUNNER_TEMP/openvpn.pid")" 2>/dev/null || true
          fi
