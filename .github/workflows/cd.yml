name: CD

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: Commit SHA of the image to deploy manually on the VM
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    name: Verify image for manual deployment
    runs-on: ubuntu-latest
    steps:
      - name: Validate image SHA
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          if [[ ! "$IMAGE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "image_sha must be the full 40-character commit SHA." >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check image exists in GHCR
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: docker buildx imagetools inspect "ghcr.io/pbp-fasilkom-ui/pws:$IMAGE_SHA"

      - name: Print manual deployment command
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          echo "Image is ready: ghcr.io/pbp-fasilkom-ui/pws:$IMAGE_SHA"
          echo "Run scripts/deploy-image.sh $IMAGE_SHA on the production VM."
