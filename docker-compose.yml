services:
  db:
    container_name: db-pemasak
    image: postgres:16.0-alpine3.18
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGPORT: ${DB_PORT}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    deploy:
      resources:
        limits:
          memory: 24G  # ~19% of 128GB total RAM  
        reservations:
          memory: 12G  # Minimum reserved
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "${DB_NAME}"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    networks:
      - pemasak-control
    ports:
      # Loopback only. Docker's own iptables rules bypass the host firewall, so
      # a bare "5432:5432" published this to the internet -- reachable with the
      # documented default password.
      - "127.0.0.1:${DB_PORT}:${DB_PORT}"

  server:
    container_name: server-pemasak
    restart: always
    env_file: .env
    image: ${PWS_IMAGE:-ghcr.io/pbp-fasilkom-ui/pws:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Loopback only; public traffic arrives through Traefik, which terminates
      # TLS. Publishing on 0.0.0.0 allowed reaching the app over plain HTTP.
      - "127.0.0.1:8080:8080"
    environment:
      - "GIT_BASE=./git-repo"
    volumes:
      - ./configuration.yml:/app/configuration.yml
      # Needs write access to build and run project containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./git-repo:/app/git-repo
    depends_on:
      db:
        condition: service_started
    # On both: pemasak to reach the project containers it manages,
    # pemasak-control to reach the database.
    networks:
      # Deliberately NOT on `pemasak`. Student containers live there, and
      # container ports are reachable across a shared docker network regardless
      # of any `ports:` mapping -- so a deployed student app could reach
      # server-pemasak:8080 directly, bypassing Traefik entirely. That let it
      # forge X-Forwarded-For outright (the rate limiter's key), flood the
      # limiter's table, and reach the API unmediated. Nothing here needs that
      # network: containers are managed through the Docker socket, and the
      # proxy fallback that would have used domains.docker_ip is disabled.
      # Being single-homed also removes the Traefik multi-network ambiguity.
      - pemasak-control
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pws-http.rule=Host(`${DOMAIN:-localhost}`) || Host(`www.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.pws-http.entrypoints=web"
      - "traefik.http.routers.pws-http.middlewares=pws-https-redirect"
      - "traefik.http.middlewares.pws-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.pws-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.pws-app.rule=Host(`${DOMAIN:-localhost}`) || Host(`www.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.pws-app.entrypoints=websecure"
      - "traefik.http.routers.pws-app.middlewares=security-headers@docker"
      - "traefik.http.routers.pws-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pws-app.service=pws"
      - "traefik.http.services.pws.loadbalancer.server.port=8080"

  # Skip monitoring stack for Windows (Optional)
  prometheus:
    image: prom/prometheus
    container_name: prometheus-pemasak
    restart: always
    networks:
      - pemasak-control
    ports:
      - "127.0.0.1:9090:9090"
    security_opt:
      - no-new-privileges:true
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=180d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      # --web.enable-lifecycle removed: it exposes unauthenticated /-/reload
      # and /-/quit, so anyone who reached this port could reload the config or
      # shut monitoring down.
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prom_data:/prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-pemasak
    restart: always
    networks:
      - pemasak-control
    security_opt:
      - no-new-privileges:true
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-pemasak
    restart: always
    env_file: .env
    networks:
      - pemasak-control
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      # Anonymous access and sign-up off explicitly, since this instance is
      # published on a public hostname and its datasource can query logs.
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      # Renderer disabled for Windows - no renderer service
    volumes:
      - ./config/grafana:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana-http.rule=Host(`grafana.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.grafana-http.entrypoints=web"
      - "traefik.http.routers.grafana-http.service=grafana"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.middlewares=security-headers@docker"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana.service=grafana"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  portainer:
    container_name: portainer-pemasak
    image: portainer/portainer-ce:2.39.6
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - pemasak-control
    security_opt:
      - no-new-privileges:true
    # Loopback only, and no Traefik route.
    #
    # Portainer holds the host Docker socket, so it is equivalent to root on the
    # host, and its admin account is claimed by whoever visits an unclaimed
    # instance first -- a race an internet attacker can win any time the volume
    # is new. Reach it through an SSH tunnel:
    #   ssh -L 9000:127.0.0.1:9000 <host>
    ports:
      - "127.0.0.1:9000:9000"

  docs-ui:
    container_name: docs-ui-pemasak
    build:
      context: ./docs-ui
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=3001
    networks:
      - pemasak-control
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs-http.rule=Host(`docs.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.docs-http.entrypoints=web"
      - "traefik.http.routers.docs-http.service=docs"
      - "traefik.http.routers.docs.rule=Host(`docs.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.docs.entrypoints=websecure"
      - "traefik.http.routers.docs.middlewares=security-headers@docker"
      - "traefik.http.routers.docs.tls.certresolver=letsencrypt"
      - "traefik.http.routers.docs.service=docs"
      - "traefik.http.services.docs.loadbalancer.server.port=3001"

  traefik:
    container_name: traefik-pemasak
    image: traefik:v3.6
    env_file: .env
    command: 
      # The API and dashboard were served with no authentication at all, and
      # /api/rawdata returns the full routing table and internal service map.
      #
      # Publishing on the host's loopback was not enough: a published port only
      # constrains access from the HOST. Traefik sits on both docker networks,
      # so any container -- including every student app -- could still reach
      # traefik-pemasak:8080 directly.
      #
      # Binding the API's entrypoint to the container's own loopback removes it
      # from every network while keeping the dashboard and API intact. Reach it
      # from the VM with (note the IPv4 literal -- `localhost` resolves to ::1,
      # which this does not bind):
      #   docker exec traefik-pemasak wget -qO- http://127.0.0.1:8080/api/rawdata
      # Verified: refused from any other container, port 80/443 routing
      # unaffected. Browser access to the dashboard needs a temporary
      # republish -- see README.
      - --api.insecure=true
      - --entrypoints.traefik.address=127.0.0.1:8080
      # No forwardedHeaders.trustedIPs on purpose. Listing the docker subnets
      # here trusted 172.20.0.0/16 -- the STUDENT network -- so a project
      # container, which can reach Traefik on :80, could supply its own
      # X-Forwarded-For and have it preserved. With no trusted source Traefik
      # overwrites the header with the address it actually observed, which is
      # exactly what src/rate_limit.rs needs to key on.
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --accesslog=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Manual wildcard certificates from ssl/ folder
      - --providers.file.directory=/ssl
      - --providers.file.watch=true
      # Buypass ACME for root domain (HTTP challenge) - RATE LIMITED
      - --certificatesresolvers.buypass.acme.httpchallenge=true
      - --certificatesresolvers.buypass.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.buypass.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.buypass.acme.storage=/acme/buypass.json
      - --certificatesresolvers.buypass.acme.caserver=https://api.buypass.com/acme/directory
      # Let's Encrypt ACME for apex domain (no EAB required)
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/letsencrypt.json
      - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
    ports:
      - "80:80"
      - "443:443"
      # No mapping for the API: it binds the container's loopback (see the
      # entrypoint flag above), which docker port publishing cannot forward to.
      # That is the point -- it is reachable only from inside the container.
    depends_on:
      server:
        condition: service_started
      grafana:
        condition: service_started
      portainer:
        condition: service_started
    volumes:
      # Read-only: Traefik only needs to watch container labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ssl:/ssl:ro
      - traefik-data:/acme
    # On both networks: pemasak to route project containers,
    # pemasak-control to route the app, docs and Grafana.
    networks:
      - pemasak
      - pemasak-control
    labels:
      - "traefik.enable=true"
      # Security headers, applied to every router below. None of these were set
      # on any response.
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      # includeSubdomains covers every student app subdomain, which are served
      # by the manually renewed wildcard in ./ssl. That is deliberate, but it
      # means a lapsed wildcard locks students out rather than showing a
      # click-through warning -- the renewal is a hard dependency, not a chore.
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      # No stsPreload. Sending it asks browsers to hard-code HTTPS-only for this
      # domain and every subdomain; removal takes months and cannot be rushed.
      # It should only be sent by someone who has deliberately submitted the
      # domain to the preload list and can guarantee HTTPS everywhere under it.
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"

volumes:
  db-data:
    driver: local
  prom_data:
    driver: local
  grafana-data:
    driver: local
  traefik-data:
    driver: local
  portainer-data:
    driver: local

networks:
  # Project containers live here, along with Traefik so it can route them.
  # Nothing on this network should be part of the control plane.
  pemasak:
    name: pemasak  # Explicit network name without project prefix
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16  # Support up to 65,534 containers (was /24 = 254)

  # Control plane: database, monitoring, Portainer, docs. Previously all of
  # these shared the `pemasak` network with student containers, so a deployed
  # student app could reach the platform's own Postgres (default password
  # "123") and the Portainer API directly.
  pemasak-control:
    name: pemasak-control
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16
