# Caching Alpine package mirror for project builds. See pkgcache-apk in
# docker-compose.yml.
#
# Plain HTTP is safe here: apk verifies every index and package against the
# Alpine signing keys already in the image, so a tampered file is rejected.

proxy_cache_path /var/cache/nginx/apk levels=1:2 keys_zone=apk:10m
                 max_size=20g inactive=60d use_temp_path=off;

server {
    listen 3142;

    # Resolve the CDN per request rather than once at startup, IPv4 only: the
    # host has no IPv6 route, and nginx would otherwise try AAAA answers.
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    set $upstream https://dl-cdn.alpinelinux.org;

    proxy_ssl_server_name on;
    proxy_set_header Host dl-cdn.alpinelinux.org;
    proxy_cache apk;
    proxy_cache_key $uri;
    # Concurrent builds asking for the same package wait for one download.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5m;
    # Keep serving what is cached while the CDN is slow or failing.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_read_timeout 120s;

    # Indexes change whenever the branch is updated.
    location ~ ^/alpine/.*/APKINDEX\.tar\.gz$ {
        proxy_cache_valid 200 5m;
        proxy_pass $upstream;
    }

    # A package file never changes once published under its version.
    location /alpine/ {
        proxy_cache_valid 200 60d;
        proxy_cache_valid 404 1m;
        proxy_pass $upstream;
    }

    location / {
        return 404;
    }
}
